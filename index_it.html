<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
https://cdn.jsdelivr.net/npm/marked/marked.min.js>
 
<style>
 
body {
  margin:0;
  display:flex;
  justify-content:center;
  background:#1e1e2f;
  font-family:Arial;
}
 
/* COMPACT CONTAINER */
.app {
  width:92%;
  max-width:380px;
  height:70vh;
  margin-top:20px;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:12px;
}
 
/* HEADER */
.header {
  padding:10px;
  text-align:center;
  background:#111;
  color:#00d4ff;
}
 
/* CHAT */
.chat {
  flex:1;
  overflow-y:auto;
  padding:8px;
  display:flex;
  flex-direction:column;
}
 
/* MESSAGE BOX */
.msg {
  max-width:75%;
  padding:8px;
  margin:4px 0;
  border-radius:8px;
  font-size:13px;
  line-height:1.3;
  white-space:pre-wrap;
  word-break:break-word;
}
 
/* USER */
.user {
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
/* BOT */
.bot {
  background:#2d2d44;
  color:#eee;
}
 
/* REMOVE ALL DEFAULT MARKDOWN SPACING */
.msg h1, .msg h2, .msg h3, .msg h4 {
  margin:4px 0;
  font-size:14px;
}
 
.msg p {
  margin:3px 0;
}
 
.msg ul {
  margin:4px 0;
  padding-left:16px;
}
 
.msg li {
  margin:2px 0;
}
 
/* COMMAND BLOCK (FIXED POSITIONING) */
.msg pre {
  background:#111;
  padding:6px;
  border-radius:5px;
  margin:5px 0;
  font-size:12px;
  white-space:pre-wrap;
  word-break:break-word;
}
 
/* INPUT */
.input {
  display:flex;
  padding:6px;
  background:#111;
}
 
input {
  flex:1;
  padding:6px;
  background:#333;
  color:white;
  border:none;
}
 
button {
  padding:6px;
  background:#0078d7;
  color:white;
  border:none;
}
 
</style>
</head>
 
<body>
 
<div class="app">
 
<div class="header">🖥️ NexAI IT</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<input id="msg">
<button onclick="send()">Send</button>
</div>
 
</div>
 
<script>
 
function add(text,type){
  const d=document.createElement("div");
  d.className="msg "+type;
 
  d.innerHTML = type==="bot"
    ? marked.parse(text)
    : text;
 
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
 
function send(){
  let text=msg.value.trim();
  if(!text)return;
 
  add(text,"user");
 
  let thinking=document.createElement("div");
  thinking.className="msg bot";
  thinking.innerText="Thinking...";
  chat.appendChild(thinking);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  })
  .then(r=>r.json())
  .then(d=>{
    thinking.remove();
    add(d.response,"bot");
  });
 
  msg.value="";
}
 
msg.addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});
 
</script>
 
</body>
</html>
