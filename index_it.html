<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body{
  margin:0;
  font-family:Arial;
  background:#1e1e2f;
}
 
.app{
  width:95%;
  max-width:420px;
  height:75vh;
  margin:20px auto;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:12px;
  overflow:hidden;
}
 
.header{
  padding:12px;
  text-align:center;
  background:#111;
  color:#00d4ff;
}
 
/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
  padding-bottom:70px;
}
 
/* MESSAGE FIXES */
.msg{
  max-width:75%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  font-size:13px;
  word-wrap:break-word;
}
 
/* FIX LONG TEXT */
.msg pre{
  white-space:pre-wrap;
  word-wrap:break-word;
  background:#111;
  padding:6px;
  border-radius:5px;
  font-size:12px;
}
 
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot{
  background:#2d2d44;
  color:white;
}
 
.input{
  display:flex;
  padding:8px;
  background:#111;
}
 
input{
  flex:1;
  padding:8px;
  background:#333;
  color:white;
  border:none;
}
 
button{
  padding:8px;
  background:#0078d7;
  color:white;
  border:none;
}
</style>
</head>
 
<body>
 
<div class="app">
 
<div class="header">🖥️ NexAI IT</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<input id="msg" placeholder="Ask IT..." />
<button onclick="send()">Send</button>
</div>
 
</div>
 
<script>
const chat=document.getElementById("chat");
const msgInput=document.getElementById("msg");
const session=Date.now();
 
function add(text,type){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.innerHTML=type==="bot"?marked.parse(text):text;
  chat.appendChild(d);
 
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}
 
function send(){
  const t=msgInput.value.trim();
  if(!t)return;
 
  add(t,"user");
 
  const thinking=document.createElement("div");
  thinking.className="msg bot";
  thinking.innerText="Thinking...";
  chat.appendChild(thinking);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      module:"it",
      session_id:session
    })
  })
  .then(r=>r.json())
  .then(d=>{
    thinking.remove();
    add(d.text,"bot");
  });
 
  msgInput.value="";
}
 
msgInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    send();
  }
});
</script>
 
</body>
</html>
