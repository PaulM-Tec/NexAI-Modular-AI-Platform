<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>NexAI IT Support</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
 
body {
    margin: 0;
    font-family: Arial;
    background: #1e1e2f;
}
 
/* FIXED CENTERED APP LIKE BEFORE */
.wrapper {
    max-width: 850px;
    margin: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
 
/* HEADER */
.header {
    background: #111;
    color: #00d4ff;
    padding: 12px;
    text-align: center;
    font-weight: bold;
}
 
/* CHAT AREA TAKES FULL SPACE */
.chatbox {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}
 
/* MESSAGES */
.message {
    margin: 10px 0;
    padding: 12px;
    border-radius: 10px;
    max-width: 75%;
    line-height: 1.4;
}
 
.user {
    background: #0078d7;
    color: white;
    margin-left: auto;
}
 
.bot {
    background: #2d2d44;
    color: #e6e6e6;
}
 
/* INPUT BAR FIXED */
.input-area {
    display: flex;
    padding: 10px;
    background: #111;
}
 
input {
    flex: 1;
    padding: 12px;
    border: none;
    background: #2d2d44;
    color: white;
}
 
button {
    padding: 12px;
    background: #0078d7;
    color: white;
    border: none;
}
 
/* FIX MOBILE HEIGHT */
@media (max-width: 600px) {
    .wrapper {
        max-width: 100%;
        height: 100vh;
    }
 
    .message {
        max-width: 90%;
    }
}
 
</style>
</head>
 
<body>
 
<div class="wrapper">
 
    <div class="header">🖥️ NexAI Enterprise IT Support</div>
 
    <div id="chat" class="chatbox"></div>
 
    <div class="input-area">
        <input id="msg" placeholder="Enter IT query (Azure, Exchange, AD...)" />
        <button onclick="sendMessage()">Send</button>
    </div>
 
</div>
 
<script>
 
let sessionId = Date.now();
 
/* ADD MESSAGE */
function addMessage(text, cls) {
    let div = document.createElement("div");
    div.className = "message " + cls;
 
    div.innerHTML =
        cls === "bot"
        ? marked.parse(text)
        : text;
 
    document.getElementById("chat").appendChild(div);
 
    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;
}
 
/* SEND MESSAGE */
function sendMessage() {
    const input = document.getElementById("msg");
    const text = input.value.trim();
 
    if (!text) return;
 
    addMessage(text, "user");
 
    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            message: text,
            session_id: sessionId
        })
    })
    .then(res => res.json())
    .then(data => addMessage(data.response, "bot"));
 
    input.value = "";
}
 
/* ENTER KEY FIX */
document.getElementById("msg").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
 
</script>
 
</body>
</html>
