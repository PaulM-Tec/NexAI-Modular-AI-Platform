<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>NexAI IT Support</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #1e1e2f;
}
 
/* CENTER CONTAINER */
.container {
    max-width: 950px;
    margin: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #252542;
}
 
/* HEADER */
.header {
    background: #111;
    color: #00d4ff;
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #333;
}
 
/* CHAT AREA */
.chatbox {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}
 
/* MESSAGE BUBBLES */
.message {
    margin: 10px 0;
    padding: 12px;
    border-radius: 8px;
    max-width: 80%;
    line-height: 1.4;
}
 
.user {
    background: #0078d7;
    color: white;
    margin-left: auto;
}
 
.bot {
    background: #2d2d44;
    color: #e6e6e6;
}
 
/* IT STYLE CODE BLOCK */
pre {
    background: #111;
    color: #00ff9c;
    padding: 10px;
    border-radius: 5px;
    overflow-x: auto;
}
 
/* INPUT AREA */
.input-area {
    display: flex;
    padding: 10px;
    background: #111;
    border-top: 1px solid #333;
}
 
input {
    flex: 1;
    padding: 10px;
    border: none;
    background: #2d2d44;
    color: white;
}
 
input::placeholder {
    color: #aaa;
}
 
button {
    padding: 10px 15px;
    background: #0078d7;
    color: white;
    border: none;
}
 
/* MOBILE OPTIMISATION */
@media (max-width: 600px) {
    .container {
        width: 100%;
        height: 100vh;
    }
 
    .message {
        max-width: 95%;
        font-size: 14px;
    }
 
    .header {
        font-size: 16px;
    }
}
</style>
</head>
 
<body>
 
<div class="container">
 
    <div class="header">🖥️ NexAI Enterprise IT Support</div>
 
    <div id="chat" class="chatbox"></div>
 
    <div class="input-area">
        <input id="msg" placeholder="Enter IT query (Azure, Exchange, AD...)" />
        <button onclick="sendMessage()">Send</button>
    </div>
 
</div>
 
<script>
 
let sessionId = Date.now();
 
/* ADD MESSAGE */
function addMessage(text, cls) {
    let div = document.createElement("div");
    div.className = "message " + cls;
 
    div.innerHTML = cls === "bot"
        ? marked.parse(text)
        : text;
 
    document.getElementById("chat").appendChild(div);
 
    // AUTO SCROLL
    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;
}
 
/* SEND MESSAGE */
function sendMessage() {
    let input = document.getElementById("msg");
    let text = input.value;
 
    if (!text) return;
 
    addMessage(text, "user");
 
    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            message: text,
            session_id: sessionId
        })
    })
    .then(res => res.json())
    .then(data => {
        addMessage(data.response, "bot");
    });
 
    input.value = "";
}
 
</script>
 
</body>
</html>
