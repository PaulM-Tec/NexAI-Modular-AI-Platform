<!DOCTYPE html>
<html>
<head>
 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
 
<style>
 
/* GLOBAL (FIXED) */
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
 
/* NOTICE */
.notice{
  text-align:center;
  font-size:12px;
  color:#aaa;
  padding:6px;
  background:#111;
}
 
/* WRAPPER */
.wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  height:calc(100% - 24px);
}
 
/* APP (DESKTOP PERFECT — DO NOT TOUCH) */
.app{
  width:100%;
  max-width:420px;
  height:95%;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
}
 
/* HEADER */
.header{
  padding:14px;
  text-align:center;
  background:linear-gradient(90deg,#0078d7,#00c6ff);
  color:white;
  font-weight:bold;
}
 
/* CHAT (VERY IMPORTANT FIX) */
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
 
  min-height:0; /* CRITICAL FIX */
}
 
/* MESSAGE */
.msg{
  max-width:80%;
  border-radius:16px;
  padding:12px;
  font-size:14px;
}
 
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
}
 
/* INPUT (FIXED STRUCTURE) */
.input{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:#111;
}
 
/* TEXTAREA */
textarea{
  flex:1;
  padding:10px;
  background:#2b2b40;
  color:white;
  border:none;
  border-radius:12px;
  resize:none;
  font-size:14px;
  max-height:120px;
  overflow-y:auto;
}
 
/* BUTTON */
button{
  padding:10px 14px;
  background:#0078d7;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
  flex-shrink:0;
}
 
/* PERFECT CIRCLE */
.upload-btn{
  width:42px;
  height:42px;
  min-width:42px;
  min-height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  padding:0;
}
 
/* MOBILE FIX */
@media (max-width:600px){
 
  .wrapper{
    height:100%;
    align-items:stretch;
  }
 
  .app{
    height:100%;
    max-width:100%;
    border-radius:0;
    box-shadow:none;
  }
 
  body{
    display:flex;
    flex-direction:column;
  }
 
}
 
</style>
</head>
 
<body>
 
<div class="notice">
AI-generated content may be incorrect
</div>
 
<div class="wrapper">
 
<div class="app">
 
<div class="header">⚡ NexAI Assist</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
 
<button class="upload-btn" onclick="selectImage()">+</button>
 
<textarea id="msg" rows="1" placeholder="Ask an IT question..."></textarea>
 
<button onclick="send()">Send</button>
 
<input type="file" id="fileInput" style="display:none" accept="image/*">
 
</div>
 
</div>
 
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
 
/* GREETING */
window.onload = () => {
  add("👋 Hi, I'm NexAI. How can I help you with IT today?", "bot");
};
 
/* AUTO EXPAND */
msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = msgInput.scrollHeight + "px";
});
 
/* ADD MESSAGE */
function add(text, type){
 
  if(type === "user"){
    const d=document.createElement("div");
    d.className="msg user";
    d.innerText=text;
    chat.appendChild(d);
    scrollDown();
    return;
  }
 
  const parts=text.split(/```/g);
 
  parts.forEach((p,i)=>{
    if(i%2===0){
      if(p.trim()){
        let d=document.createElement("div");
        d.className="msg bot";
        d.innerHTML=marked.parse(p);
        chat.appendChild(d);
      }
    } else {
      let clean=cleanCode(p);
 
      let d=document.createElement("div");
      d.className="msg bot";
 
      d.innerHTML=`
        <div class="code-block">
          <div class="code-header">
            PowerShell
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
          <pre>${escapeHtml(clean)}</pre>
        </div>
      `;
 
      chat.appendChild(d);
    }
  });
 
  scrollDown();
}
 
/* CLEAN CODE */
function cleanCode(code){
  const lines=code.trim().split("\n");
  if(lines[0].toLowerCase().includes("powershell")){
    lines.shift();
  }
  return lines.join("\n");
}
 
/* SEND */
function send(){
  let t=msgInput.value.trim();
  if(!t)return;
 
  add(t,"user");
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:t,module:"it"})
  })
  .then(r=>r.json())
  .then(d=>add(d.text,"bot"));
 
  msgInput.value="";
  msgInput.style.height="auto";
}
 
/* ENTER */
msgInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});
 
/* FILE BUTTON */
function selectImage(){
  document.getElementById("fileInput").click();
}
 
document.getElementById("fileInput").addEventListener("change",e=>{
  let file=e.target.files[0];
  if(!file)return;
 
  const reader=new FileReader();
 
  reader.onload=e=>{
    let d=document.createElement("div");
    d.className="msg user";
 
    let img=document.createElement("img");
    img.src=e.target.result;
 
    d.appendChild(img);
    chat.appendChild(d);
    scrollDown();
  };
 
  reader.readAsDataURL(file);
});
 
/* PASTE */
document.addEventListener("paste",e=>{
  for(let item of e.clipboardData.items){
    if(item.type.includes("image")){
      const file=item.getAsFile();
 
      const reader=new FileReader();
 
      reader.onload=e=>{
        let d=document.createElement("div");
        d.className="msg user";
 
        let img=document.createElement("img");
        img.src=e.target.result;
 
        d.appendChild(img);
        chat.appendChild(d);
        scrollDown();
      };
 
      reader.readAsDataURL(file);
    }
  }
});
 
/* COPY */
function copyCode(btn){
  const code=btn.closest(".code-block")
               .querySelector("pre")
               .innerText.trim();
  navigator.clipboard.writeText(code);
}
 
/* SCROLL */
function scrollDown(){
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}
 
/* ESCAPE */
function escapeHtml(str){
  return str.replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[m]);
}
 
</script>
 
</body>
</html>
