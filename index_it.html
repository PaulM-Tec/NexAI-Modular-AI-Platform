<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI IT Support</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
 
body {
    margin: 0;
    font-family: Arial;
    background: #1e1e2f;
    display: flex;
    justify-content: center;
}
 
/* COMPACT CENTER PANEL */
.app {
    width: 100%;
    max-width: 600px;
    height: 90vh;
    display: flex;
    flex-direction: column;
    background: #252542;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}
 
/* HEADER */
.header {
    background: #111;
    color: #00d4ff;
    text-align: center;
    padding: 10px;
    font-size: 14px;
    font-weight: bold;
}
 
/* CHAT */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}
 
/* MESSAGES */
.msg {
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    max-width: 75%;
    font-size: 14px;
}
 
.user {
    background: #0078d7;
    color: white;
    margin-left: auto;
}
 
.bot {
    background: #2d2d44;
    color: #e6e6e6;
}
 
/* INPUT */
.input {
    display: flex;
    padding: 8px;
    background: #111;
}
 
.input input {
    flex: 1;
    padding: 8px;
    border: none;
    background: #2d2d44;
    color: white;
}
 
.input button {
    padding: 8px 12px;
    background: #0078d7;
    border: none;
    color: white;
    font-size: 13px;
}
 
/* MOBILE */
@media(max-width:600px) {
    .app {
        max-width: 100%;
        height: 95vh;
        margin-top: 0;
        border-radius: 0;
    }
}
 
</style>
</head>
 
<body>
 
<div class="app">
 
<div class="header">🖥️ NexAI IT Support</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
    <input id="msg" placeholder="Ask (Exchange, Azure, AD...)" />
    <button onclick="send()">Send</button>
</div>
 
</div>
 
<script>
 
let session = Date.now();
 
function add(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
 
    div.innerHTML = type === "bot"
        ? marked.parse(text)
        : text;
 
    const chat = document.getElementById("chat");
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}
 
function send() {
    const input = document.getElementById("msg");
    const text = input.value.trim();
    if (!text) return;
 
    add(text, "user");
 
    // THINKING INDICATOR
    const thinking = document.createElement("div");
    thinking.className = "msg bot";
    thinking.id = "thinking";
    thinking.innerText = "Thinking...";
    document.getElementById("chat").appendChild(thinking);
 
    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            message: text,
            session_id: session
        })
    })
    .then(r => r.json())
    .then(d => {
        document.getElementById("thinking")?.remove();
        add(d.response, "bot");
    })
    .catch(() => {
        document.getElementById("thinking")?.remove();
        add("Error contacting server", "bot");
    });
 
    input.value = "";
}
 
document.getElementById("msg").addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
 
</script>
 
</body>
</html>
