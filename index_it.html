<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<!-- CORRECT SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body {
  margin:0;
  background:#1e1e2f;
  font-family:Arial;
}
 
/* PANEL */
.app {
  width:95%;
  max-width:420px;
  margin:20px auto;
  height:80vh;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:12px;
}
 
.header {
  padding:12px;
  text-align:center;
  background:#111;
  color:#00d4ff;
}
 
/* CHAT */
.chat {
  flex:1;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  padding-bottom:20px; /* stops overlap */
}
 
/* MESSAGE */
.msg {
  max-width:70%;
  padding:10px;
  margin:4px 0;
  border-radius:10px;
  font-size:13px;
  line-height:1.3;
  white-space: pre-line;
  word-break: break-word;
}
 
.user {
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot {
  background:#2d2d44;
  color:white;
}
 
/* REMOVE HUGE GAPS */
.msg p { margin:2px 0; }
.msg ul { margin:2px 0; padding-left:15px; }
.msg li { margin:2px 0; }
 
/* FIX COMMAND BLOCK */
.msg pre, .msg code {
  display:block;
  background:#111;
  padding:6px;
  margin:5px 0;
  border-radius:5px;
  font-size:12px;
  white-space: pre-wrap;
  word-break: break-word;
}
 
/* INPUT */
.input {
  display:flex;
  padding:8px;
  background:#111;
}
 
input {
  flex:1;
  padding:8px;
  background:#333;
  color:white;
  border:none;
}
 
button {
  padding:8px;
  background:#0078d7;
  color:white;
  border:none;
}
</style>
</head>
 
<body>
 
<div class="app">
 
<div class="header">🖥️ NexAI IT</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<input id="msg" placeholder="Ask IT (Exchange, Azure, Entra...)" />
<button onclick="send()">Send</button>
</div>
 
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const session = Date.now();
 
function add(text,type){
  const d=document.createElement("div");
  d.className="msg "+type;
 
  if(type==="bot"){
    d.innerHTML = marked.parse(text);
  } else {
    d.textContent = text;
  }
 
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
 
function send(){
  const t = msgInput.value.trim();
  if(!t) return;
 
  add(t,"user");
 
  const thinking=document.createElement("div");
  thinking.className="msg bot";
  thinking.innerText="Thinking...";
  chat.appendChild(thinking);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      module:"it",
      session_id:session
    })
  })
  .then(r=>r.json())
  .then(d=>{
    thinking.remove();
    add(d.response,"bot");
  })
  .catch(()=>{
    thinking.remove();
    add("Error contacting server","bot");
  });
 
  msgInput.value="";
}
 
msgInput.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    e.preventDefault();
    send();
  }
});
 
</script>
 
</body>
</html>
