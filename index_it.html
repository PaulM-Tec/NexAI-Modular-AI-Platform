<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
 
<style>
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
.notice{
  text-align:center;
  font-size:12px;
  color:#aaa;
  padding:6px;
  background:#111;
}
.wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  height:calc(100% - 24px);
}
.app{
  width:100%;
  max-width:420px;
  height:95%;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
}
.header{
  padding:14px;
  text-align:center;
  background:linear-gradient(90deg,#0078d7,#00c6ff);
  color:white;
  font-weight:bold;
}
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
 
/* NEW preview bar */
.preview-bar{
  display:flex;
  gap:6px;
  padding:6px 10px;
  background:#181828;
  overflow-x:auto;
}
.preview-bar img{
  height:50px;
  border-radius:6px;
}
 
.msg{
  max-width:80%;
  width:fit-content;
  border-radius:16px;
  padding:12px;
  font-size:14px;
}
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
}
 
textarea{
  flex:1;
  padding:10px;
  background:#2b2b40;
  color:white;
  border:none;
  border-radius:12px;
  resize:none;
  font-size:14px;
}
 
/* FIXED BUTTON */
.upload-btn{
  width:42px;
  height:42px;
  min-width:42px;
  min-height:42px;
  flex-shrink:0;
  border-radius:50%;
}
 
.input{
  display:flex;
  gap:8px;
  padding:10px;
  background:#111;
}
 
button{
  background:#0078d7;
  color:white;
  border:none;
  border-radius:20px;
  padding:10px;
}
 
</style>
</head>
 
<body>
 
<div class="notice">AI-generated content may be incorrect</div>
 
<div class="wrapper">
<div class="app">
 
<div class="header">⚡ NexAI Assist</div>
 
<div id="chat" class="chat"></div>
 
<!-- preview area -->
<div id="previewBar" class="preview-bar"></div>
 
<div class="input">
<button class="upload-btn" onclick="selectImage()">+</button>
<textarea id="msg" rows="1" placeholder="Ask an IT question..."></textarea>
<button onclick="send()">Send</button>
<input type="file" id="fileInput" style="display:none" accept="image/*" multiple>
</div>
 
</div>
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const previewBar = document.getElementById("previewBar");
 
let pendingImages = [];
 
msgInput.addEventListener("input", ()=>{
  msgInput.style.height="auto";
  msgInput.style.height=msgInput.scrollHeight+"px";
});
 
function add(text,type){
  let d=document.createElement("div");
  d.className="msg "+type;
  d.innerHTML=marked.parse(text);
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
 
function send(){
  let t=msgInput.value.trim();
  if(!t && pendingImages.length===0) return;
 
  if(t) add(t,"user");
 
  pendingImages.forEach(src=>{
    let d=document.createElement("div");
    d.className="msg user";
    let img=document.createElement("img");
    img.src=src;
    img.style.maxWidth="100%";
    d.appendChild(img);
    chat.appendChild(d);
  });
 
  add("Typing...","bot");
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:t})
  })
  .then(r=>r.json())
  .then(d=>add(d.text,"bot"));
 
  pendingImages=[];
  previewBar.innerHTML="";
  msgInput.value="";
}
 
msgInput.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
 
function selectImage(){
  document.getElementById("fileInput").click();
}
 
document.getElementById("fileInput").addEventListener("change",e=>{
  [...e.target.files].forEach(file=>preview(file));
});
 
document.addEventListener("paste",e=>{
  for(let item of e.clipboardData.items){
    if(item.type.includes("image")){
      preview(item.getAsFile());
    }
  }
});
 
function preview(file){
  const reader=new FileReader();
  reader.onload=e=>{
    let src=e.target.result;
    pendingImages.push(src);
 
    let img=document.createElement("img");
    img.src=src;
    previewBar.appendChild(img);
  };
  reader.readAsDataURL(file);
}
 
</script>
 
</body>
</html>
