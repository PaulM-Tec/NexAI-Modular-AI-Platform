<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<!-- FIXED SCRIPT TAG -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body {
  margin:0;
  background:#1e1e2f;
  font-family:Arial;
}
 
/* APP (KEEP AS YOU HAD — FIXED CONTAINER) */
.app {
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:420px;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#252542;
}
 
/* HEADER */
.header {
  padding:12px;
  text-align:center;
  background:#111;
  color:#00d4ff;
  flex:0 0 auto;
}
 
/* CHAT (CRITICAL FIX HERE) */
.chat {
  flex:1;
  overflow-y:auto;
  padding:10px;
  padding-bottom:80px;   /* FIX OVERLAP */
  display:flex;
  flex-direction:column;
}
 
/* MESSAGES */
.msg {
  max-width:70%;
  padding:10px;
  margin:4px 0;
  border-radius:10px;
  font-size:13px;
}
 
.user {
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot {
  background:#2d2d44;
  color:white;
}
 
/* COMMAND BLOCK */
.msg pre {
  background:#111;
  padding:6px;
  border-radius:5px;
  font-size:12px;
  white-space:pre-wrap;
}
 
/* INPUT */
.input {
  display:flex;
  padding:8px;
  background:#111;
  flex:0 0 auto;
}
 
input {
  flex:1;
  padding:8px;
  background:#333;
  color:white;
  border:none;
}
 
button {
  padding:8px;
  background:#0078d7;
  color:white;
  border:none;
}
</style>
</head>
 
<body>
 
<div class="app">
 
<div class="header">🖥️ NexAI IT</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<input id="msg" placeholder="Ask IT (Exchange, Azure, Entra...)" />
<button onclick="send()">Send</button>
</div>
 
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const session = Date.now();
 
function add(text,type){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.innerHTML = type==="bot" ? marked.parse(text) : text;
  chat.appendChild(d);
 
  /* FIX SCROLL POSITION */
  setTimeout(() => {
    chat.scrollTop = chat.scrollHeight;
  }, 50);
}
 
function send(){
  const t = msgInput.value.trim();
  if(!t) return;
 
  add(t,"user");
 
  const thinking=document.createElement("div");
  thinking.className="msg bot";
  thinking.innerText="Thinking...";
  chat.appendChild(thinking);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      module:"it",
      session_id:session
    })
  })
  .then(r=>r.json())
  .then(d=>{
    thinking.remove();
    add(d.text,"bot");
  });
 
  msgInput.value="";
}
 
msgInput.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    send();
  }
});
 
</script>
 
</body>
</html>
