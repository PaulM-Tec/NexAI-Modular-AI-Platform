<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
.notice{
  text-align:center;
  font-size:12px;
  color:#aaa;
  padding:6px;
  background:#111;
}
.wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  height:calc(100% - 24px);
}
.app{
  width:100%;
  max-width:420px;
  height:95%;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:16px;
  overflow:hidden;
}
.header{
  padding:14px;
  text-align:center;
  background:linear-gradient(90deg,#0078d7,#00c6ff);
  color:white;
}
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:0;
}
 
/* FIXED MESSAGE */
.msg{
  max-width:80%;
  width:fit-content;
  border-radius:16px;
  padding:12px;
  font-size:14px;
  word-wrap:break-word;
}
 
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
}
 
/* FIXED CODE BLOCK */
.code-block{
  margin-top:8px;
  background:#111;
  border-radius:8px;
  overflow:hidden;
}
.code-header{
  display:flex;
  justify-content:space-between;
  background:#333;
  padding:6px;
}
.copy-btn{
  background:#0078d7;
  color:white;
  border:none;
  cursor:pointer;
  padding:2px 8px;
}
 
/* CRITICAL FIX */
.code-block pre{
  margin:0;
  padding:10px;
  overflow-x:auto;
  max-width:100%;
  white-space:pre;
}
 
/* INPUT */
.input{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:#111;
}
textarea{
  flex:1;
  padding:10px;
  background:#2b2b40;
  color:white;
  border:none;
  border-radius:12px;
}
</style>
</head>
 
<body>
 
<div class="notice">AI-generated content may be incorrect</div>
 
<div class="wrapper">
<div class="app">
 
<div class="header">⚡ NexAI Assist</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<textarea id="msg" rows="1"></textarea>
<button onclick="send()">Send</button>
</div>
 
</div>
</div>
 
<script>
 
const chat = document.getElementById("chat");
const session = Date.now();
 
/* FIXED RENDER (single message container) */
function add(text,type){
 
  const container = document.createElement("div");
  container.className = "msg " + type;
 
  const parts = text.split(/```/g);
  let html = "";
 
  parts.forEach((p,i)=>{
    if(i%2===0){
      html += marked.parse(p);
    } else {
      html += `
        <div class="code-block">
          <div class="code-header">
            PowerShell
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
          <pre>${escapeHtml(p)}</pre>
        </div>`;
    }
  });
 
  container.innerHTML = html;
  chat.appendChild(container);
 
  scrollDown();
}
 
/* COPY */
function copyCode(btn){
  const code = btn.closest(".code-block").querySelector("pre").innerText;
  navigator.clipboard.writeText(code);
}
 
/* SEND */
function send(){
  let t=document.getElementById("msg").value.trim();
  if(!t)return;
 
  add(t,"user");
 
  let typing=document.createElement("div");
  typing.className="msg bot";
  typing.innerText="Typing...";
  chat.appendChild(typing);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      session_id:session
    })
  })
  .then(r=>r.json())
  .then(d=>{
    typing.remove();
    add(d.text,"bot");
  });
}
 
/* SCROLL */
function scrollDown(){
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}
 
/* ESCAPE */
function escapeHtml(str){
  return str.replace(/[&<>]/g,m=>(
    {"&":"&amp;","<":"&lt;",">":"&gt;"}[m]
  ));
}
 
</script>
 
</body>
</html>
