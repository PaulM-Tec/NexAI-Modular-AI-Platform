<!DOCTYPE html>
<html lang="en">
 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>NexAI IT Support</title>
 
<!-- FIXED SCRIPT (CRITICAL) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
 
body {
    margin: 0;
    font-family: Arial;
    background: #1e1e2f;
    display: flex;
    justify-content: center;
}
 
/* FIXED PANEL SIZE (LIKE BEFORE) */
.app {
    width: 100%;
    max-width: 700px;
    height: 95vh;
    display: flex;
    flex-direction: column;
    background: #252542;
}
 
/* HEADER */
.header {
    background: #111;
    color: #00d4ff;
    text-align: center;
    padding: 12px;
    font-weight: bold;
}
 
/* CHAT */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}
 
/* MESSAGES */
.msg {
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    max-width: 80%;
}
 
.user {
    background: #0078d7;
    color: white;
    margin-left: auto;
}
 
.bot {
    background: #2d2d44;
    color: #e6e6e6;
}
 
/* INPUT */
.input {
    display: flex;
    padding: 10px;
    background: #111;
}
 
.input input {
    flex: 1;
    padding: 10px;
    border: none;
    background: #2d2d44;
    color: white;
}
 
.input button {
    padding: 10px;
    background: #0078d7;
    color: white;
    border: none;
}
 
/* MOBILE */
@media(max-width:600px) {
    .app {
        height: 100vh;
        max-width: 100%;
    }
}
 
</style>
</head>
 
<body>
 
<div class="app">
 
<div class="header">🖥️ NexAI Enterprise IT Support</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
    <input id="msg" placeholder="Ask IT (Exchange, Azure, AD...)" />
    <button onclick="send()">Send</button>
</div>
 
</div>
 
<script>
 
let session = Date.now();
 
function add(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
 
    div.innerHTML = type === "bot"
        ? marked.parse(text)
        : text;
 
    const chat = document.getElementById("chat");
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}
 
function send() {
    const input = document.getElementById("msg");
    const text = input.value.trim();
 
    if (!text) return;
 
    add(text, "user");
 
    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            message: text,
            session_id: session
        })
    })
    .then(r => r.json())
    .then(d => add(d.response, "bot"))
    .catch(() => add("Error contacting server", "bot"));
 
    input.value = "";
}
 
/* ENTER KEY FIX */
document.getElementById("msg").addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});
 
</script>
 
</body>
</html>
