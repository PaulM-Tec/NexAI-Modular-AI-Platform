<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<!-- FIXED SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body {
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#1e1e2f;
  font-family:Arial;
}
 
.app {
  width:95%;
  max-width:420px;
  height:85vh;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:12px;
}
 
.header {
  padding:12px;
  text-align:center;
  background:#111;
  color:#00d4ff;
}
 
.chat {
  flex:1;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
}
 
/* FIXED MESSAGE BEHAVIOUR */
.msg {
  max-width:70%;
  padding:10px;
  margin:4px 0;
  border-radius:10px;
  font-size:13px;
  line-height:1.3;
  word-break:break-word;
}
 
.user {
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot {
  background:#2d2d44;
  color:#eee;
}
 
.input {
  display:flex;
  padding:8px;
  background:#111;
}
 
input {
  flex:1;
  padding:8px;
  background:#333;
  color:white;
  border:none;
}
 
button {
  padding:8px;
  background:#0078d7;
  color:white;
  border:none;
}
</style>
</head>
 
<body>
 
<div class="app">
<div class="header">🖥️ NexAI IT</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<input id="msg">
<button onclick="send()">Send</button>
</div>
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msg = document.getElementById("msg");
 
function add(text,type){
    const d = document.createElement("div");
    d.className = "msg " + type;
 
    try {
        d.innerHTML = type === "bot"
            ? marked.parse(text)
            : text;
    } catch {
        d.innerText = text;
    }
 
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
}
 
function send(){
    const text = msg.value.trim();
    if(!text) return;
 
    add(text,"user");
 
    const thinking = document.createElement("div");
    thinking.className = "msg bot";
    thinking.innerText = "Thinking...";
    chat.appendChild(thinking);
 
    fetch("/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ message:text })
    })
    .then(r=>r.json())
    .then(d=>{
        thinking.remove();
        add(d.response,"bot");
    })
    .catch(()=>{
        thinking.remove();
        add("Error contacting server","bot");
    });
 
    msg.value="";
}
 
msg.addEventListener("keydown",e=>{
    if(e.key==="Enter") send();
});
 
</script>
 
</body>
</html>
