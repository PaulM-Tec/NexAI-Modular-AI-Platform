<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
 
<style>
 
/* GLOBAL */
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
 
/* WARNING BAR */
.notice{
  text-align:center;
  font-size:12px;
  color:#aaa;
  padding:6px;
  background:#111;
}
 
/* APP CONTAINER */
.app{
  width:95%;
  max-width:420px;
  height:85vh;
  margin:10px auto;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,0.5);
  overflow:hidden;
}
 
/* HEADER */
.header{
  padding:14px;
  text-align:center;
  background:linear-gradient(90deg,#0078d7,#00c6ff);
  color:white;
  font-weight:bold;
  font-size:15px;
}
 
/* CHAT AREA */
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-bottom:80px;
}
 
/* MESSAGE */
.msg{
  max-width:85%;
  border-radius:16px;
  font-size:14px;
  line-height:1.5;
  word-wrap:break-word;
  padding:10px;
}
 
/* USER */
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
  border-bottom-right-radius:4px;
}
 
/* BOT */
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
  border-bottom-left-radius:4px;
}
 
/* CODE BLOCK */
.code-block{
  background:#16172b;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}
 
/* HEADER (LIKE YOUR TARGET UI) */
.code-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 10px;
  font-size:12px;
  background:#2c2f48;
  color:#ccc;
}
 
/* CODE */
pre{
  margin:0;
  padding:12px;
  overflow-x:auto;
  font-size:13px;
  line-height:1.4;
}
 
/* COPY BUTTON */
.copy-btn{
  background:#0078d7;
  border:none;
  color:white;
  padding:4px 8px;
  font-size:12px;
  border-radius:5px;
  cursor:pointer;
}
 
/* INPUT */
.input{
  position:sticky;
  bottom:0;
  display:flex;
  gap:6px;
  padding:10px;
  background:#111;
  z-index:10;
  border-top:1px solid #333;
}
 
input{
  flex:1;
  padding:10px;
  background:#2b2b40;
  color:white;
  border:none;
  border-radius:20px;
  font-size:14px;
}
 
button{
  padding:10px 14px;
  background:#0078d7;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}
 
button:hover{
  background:#005fa3;
}
 
</style>
</head>
 
<body>
 
<div class="notice">
AI-generated content may be incorrect
</div>
 
<div class="app">
 
<div class="header">
⚡ NexAI Assist
</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<input id="msg" placeholder="Ask an IT question..." />
<button onclick="send()">Send</button>
</div>
 
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const session = Date.now();
 
/* GREETING */
window.onload = () => {
  add("👋 Hi, I'm NexAI.\nHow can I help you with IT today?", "bot");
};
 
/* ADD MESSAGE (STRUCTURED OUTPUT) */
function add(text, type){
 
  if(type === "user"){
    const d = document.createElement("div");
    d.className = "msg user";
    d.innerText = text;
    chat.appendChild(d);
    scrollDown();
    return;
  }
 
  /* SPLIT TEXT + CODE BLOCKS */
  const parts = text.split(/```/g);
 
  parts.forEach((part, index) => {
 
    // TEXT
    if(index % 2 === 0){
      if(part.trim()){
        const t = document.createElement("div");
        t.className = "msg bot";
        t.innerHTML = marked.parse(part);
        chat.appendChild(t);
      }
    }
 
    // CODE BLOCK
    else {
      const c = document.createElement("div");
      c.className = "msg bot";
 
      c.innerHTML = `
        <div class="code-block">
          <div class="code-header">
            PowerShell
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
          <pre>${escapeHtml(part.trim())}</pre>
        </div>
      `;
 
      chat.appendChild(c);
    }
 
  });
 
  scrollDown();
}
 
/* SCROLL */
function scrollDown(){
  setTimeout(() => chat.scrollTop = chat.scrollHeight, 50);
}
 
/* SEND */
function send(){
  const t = msgInput.value.trim();
  if(!t) return;
 
  add(t, "user");
 
  const thinking = document.createElement("div");
  thinking.className = "msg bot";
  thinking.innerText = "Typing...";
  chat.appendChild(thinking);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      module:"it",
      session_id:session
    })
  })
  .then(r => r.json())
  .then(d => {
    thinking.remove();
    add(d.text, "bot");
  });
 
  msgInput.value="";
}
 
/* ENTER */
msgInput.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    send();
  }
});
 
/* COPY */
function copyCode(btn){
  const code = btn.closest(".code-block").querySelector("pre").innerText;
 
  navigator.clipboard.writeText(code).then(()=>{
    btn.innerText="Copied!";
    setTimeout(()=>btn.innerText="Copy",1500);
  });
}
 
/* ESCAPE HTML */
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, function (m) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m];
  });
}
 
</script>
 
</body>
</html>
