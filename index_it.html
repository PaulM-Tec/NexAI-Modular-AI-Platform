<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
/favicon.ico?v=2
 
<style>
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
.notice{
  text-align:center;
  font-size:12px;
  color:#aaa;
  padding:6px;
  background:#111;
}
.wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  height:calc(100% - 24px);
}
.app{
  width:100%;
  max-width:420px;
  height:95%;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
}
.header{
  padding:14px;
  text-align:center;
  background:linear-gradient(90deg,#0078d7,#00c6ff);
  color:white;
  font-weight:bold;
}
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:0;
}
 
.msg{
  max-width:80%;
  width:fit-content;
  border-radius:16px;
  padding:12px;
  font-size:14px;
  overflow-wrap:break-word;
}
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
}
.msg img{
  max-width:100%;
  border-radius:10px;
  margin-top:6px;
}
 
/* CODE BLOCK */
.code-block{
  background:#111;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
}
.code-header{
  display:flex;
  justify-content:space-between;
  background:#333;
  padding:6px;
  font-size:12px;
}
.copy-btn{
  background:#0078d7;
  color:white;
  border:none;
  cursor:pointer;
  padding:2px 8px;
  border-radius:6px;
}
.code-block pre{
  margin:0;
  padding:10px;
  overflow-x:auto;
  max-width:100%;
  white-space:pre;
}
 
/* INPUT */
.input{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:#111;
}
textarea{
  flex:1;
  padding:10px;
  background:#2b2b40;
  color:white;
  border:none;
  border-radius:12px;
  resize:none;
  font-size:14px;
  max-height:120px;
  overflow-y:auto;
}
button{
  padding:10px 14px;
  background:#0078d7;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
  flex-shrink:0;
}
.upload-btn{
  width:42px;
  height:42px;
  border-radius:50%;
}
 
/* MOBILE */
@media (max-width:600px){
  .wrapper{
    height:100%;
    align-items:stretch;
  }
  .app{
    height:100%;
    max-width:100%;
    border-radius:0;
    box-shadow:none;
  }
  body{
    display:flex;
    flex-direction:column;
  }
}
</style>
</head>
 
<body>
 
<div class="notice">AI-generated content may be incorrect</div>
 
<div class="wrapper">
<div class="app">
 
<div class="header">⚡ NexAI Assist</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<button class="upload-btn" onclick="selectImage()">+</button>
<textarea id="msg" rows="1" placeholder="Ask an IT question..."></textarea>
<button onclick="send()">Send</button>
<input type="file" id="fileInput" style="display:none" accept="image/*" multiple>
</div>
 
</div>
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const session = Date.now();
 
let pendingImages = [];
 
window.onload = () => {
  add("👋 Hi, I'm NexAI. How can I help you with IT today?", "bot");
};
 
/* FIX 1: TEXTAREA AUTO EXPAND RESTORED */
msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = msgInput.scrollHeight + "px";
});
 
/* ADD MESSAGE */
function add(text, type){
 
  const d = document.createElement("div");
  d.className = "msg " + type;
 
  const parts = text.split(/```/g);
  let html = "";
 
  parts.forEach((p,i)=>{
    if(i%2===0){
      html += marked.parse(p);
    } else {
      let cleaned = p.replace(/^powershell\s*/i,'');
 
      html += `
        <div class="code-block">
          <div class="code-header">
            PowerShell
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
          <pre>${escapeHtml(cleaned)}</pre>
        </div>`;
    }
  });
 
  d.innerHTML = html;
  chat.appendChild(d);
  scrollDown();
}
 
function copyCode(btn){
  const code = btn.closest(".code-block").querySelector("pre").innerText;
  navigator.clipboard.writeText(code);
}
 
/* SEND */
function send(){
  const t = msgInput.value.trim();
 
  if(!t && pendingImages.length === 0) return;
 
  if(t) add(t, "user");
 
  pendingImages.forEach(src=>{
    const d = document.createElement("div");
    d.className="msg user";
    const img = document.createElement("img");
    img.src = src;
    d.appendChild(img);
    chat.appendChild(d);
  });
 
  const typing = document.createElement("div");
  typing.className = "msg bot";
  typing.innerText = "Typing...";
  chat.appendChild(typing);
 
  if(t){
    fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:t,
        module:"it",
        session_id:session
      })
    })
    .then(r => r.json())
    .then(d => {
      typing.remove();
      add(d.text, "bot");
    });
  } else {
    const formData = new FormData();
    formData.append("image", dataURLtoFile(pendingImages[0]));
    formData.append("session_id", session);
 
    fetch("/analyze-image",{method:"POST",body:formData})
    .then(res=>res.json())
    .then(data=>{
      typing.remove();
      add(data.text, "bot");
    });
  }
 
  pendingImages = [];
  msgInput.value="";
  msgInput.style.height="auto";
}
 
/* ENTER */
msgInput.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
 
/* IMAGE */
function selectImage(){
  document.getElementById("fileInput").click();
}
 
document.getElementById("fileInput").addEventListener("change", e=>{
  [...e.target.files].forEach(file=>previewImage(file));
});
 
document.addEventListener("paste", e=>{
  for(let item of e.clipboardData.items){
    if(item.type.includes("image")){
      previewImage(item.getAsFile());
    }
  }
});
 
/* FIX 2: IMAGE PREVIEW RESTORED */
function previewImage(file){
  const reader = new FileReader();
  reader.onload = e=>{
    const src = e.target.result;
 
    pendingImages.push(src);
 
    // show preview immediately
    const d = document.createElement("div");
    d.className="msg user";
 
    const img = document.createElement("img");
    img.src = src;
 
    d.appendChild(img);
    chat.appendChild(d);
 
    scrollDown();
  };
  reader.readAsDataURL(file);
}
 
function scrollDown(){
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}
 
function escapeHtml(str){
  return str.replace(/[&<>]/g,m=>(
    {"&":"&amp;","<":"&lt;",">":"&gt;"}[m]
  ));
}
 
function dataURLtoFile(dataurl){
  let arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1];
  let bstr=atob(arr[1]), n=bstr.length, u8arr=new Uint8Array(n);
  while(n--) u8arr[n]=bstr.charCodeAt(n);
  return new File([u8arr],"image.png",{type:mime});
}
 
</script>
 
</body>
</html>
