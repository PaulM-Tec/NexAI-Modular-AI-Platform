<!DOCTYPE html>
<html>
<head>
    <title>NexAI IT</title>
 
    <style>
        body {
            background: #0b132b;
            font-family: Arial;
            color: white;
        }
 
        .chat-container {
            width: 400px;
            margin: 40px auto;
            background: #1c2541;
            padding: 15px;
            border-radius: 12px;
        }
 
        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 10px;
        }
 
        .user-msg {
            background: #0077b6;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: right;
        }
 
        .bot-msg {
            background: #3a506b;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
        }
 
        textarea {
            width: 75%;
            padding: 10px;
            border-radius: 6px;
        }
 
        button {
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #0077b6;
            color: white;
            cursor: pointer;
        }
 
        button:hover {
            background: #0096c7;
        }
 
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
 
        a {
            color: #4cc9f0;
            text-decoration: underline;
        }
 
        .copy-btn {
            margin-top: 5px;
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>
 
<body>
 
<div class="chat-container">
    <h2 style="text-align:center;">🖥️ NexAI IT</h2>
 
    <div id="chatBox" class="chat-box"></div>
 
    <textarea id="inputBox" rows="2" placeholder="Ask IT..."></textarea>
    <button onclick="sendMessage()">Send</button>
</div>
 
<script>
 
let session_id = Math.random().toString();
 
// FIX: define chatBox properly
const chatBox = document.getElementById("chatBox");
 
// LINK FORMATTER
function formatText(text) {
    return text.replace(/(https?:\/\/[^\s]+|portal\.azure\.com)/g, function(url) {
        if (!url.startsWith("http")) {
            url = "https://" + url;
        }
        return `<a href="${url}" target="_
}
 
// USER MESSAGE
function addUserMessage(text) {
    const div = document.createElement("div");
    div.className = "user-msg";
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
 
// BOT MESSAGE (fixed + copy button)
function addBotMessage(text) {
 
    const div = document.createElement("div");
    div.className = "bot-msg";
 
    const content = document.createElement("div");
    content.innerHTML = formatText(text);
 
    // copy button
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.innerText = "Copy";
 
    btn.onclick = () => {
        navigator.clipboard.writeText(text);
        btn.innerText = "Copied!";
        setTimeout(() => btn.innerText = "Copy", 1500);
    };
 
    div.appendChild(content);
    div.appendChild(btn);
 
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
 
// FIXED SEND FUNCTION
async function sendMessage() {
 
    const input = document.getElementById("inputBox");
    const message = input.value.trim();
 
    if (!message) return;
 
    addUserMessage(message);
 
    input.value = "";
 
    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: message,
                module: "it",
                session_id: session_id
            })
        });
 
        const data = await response.json();
 
        addBotMessage(data.text);
 
    } catch (error) {
        addBotMessage("Error connecting to server");
        console.error(error);
    }
}
 
// FIXED ENTER + SHIFT+ENTER
document.getElementById("inputBox").addEventListener("keydown", function(e) {
 
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();  // prevent newline
        sendMessage();       // send message
    }
 
    // Shift+Enter = newline (do nothing)
});
 
</script>
 
</body>
</html>
