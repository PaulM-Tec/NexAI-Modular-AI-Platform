<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<style>
/* ALL YOUR CSS — UNCHANGED */
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
/* (rest unchanged) */
</style>
</head>
<body>
 
<div class="notice">AI-generated content may be incorrect</div>
 
<div class="wrapper">
<div class="app">
<div class="header">⚡ NexAI Assist</div>
<div id="chat" class="chat"></div>
<div id="previewBar" class="preview-bar"></div>
 
<div class="input">
<button class="upload-btn" onclick="selectImage()">+</button>
<textarea id="msg" rows="1" placeholder="Ask an IT question..."></textarea>
<button onclick="send()">Send</button>
<input type="file" id="fileInput" style="display:none" accept="image/*" multiple>
</div>
 
</div>
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const previewBar = document.getElementById("previewBar");
const session = Date.now();
let pendingImages = [];
 
window.onload = () => {
  add("👋 Hi, I'm NexAI. How can I help you with IT today?", "bot");
};
 
msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = msgInput.scrollHeight + "px";
});
 
function add(text, type){
  const d = document.createElement("div");
  d.className = "msg " + type;
  const parts = text.split(/```/g);
  let html = "";
 
  parts.forEach((p,i)=>{
    if(i%2===0){
      html += marked.parse(p);
    } else {
      let cleaned = p.replace(/^powershell\s*/i,'');
      html += `
<div class="code-block">
<div class="code-header">
PowerShell
<button class="copy-btn" onclick="copyCode(this)">Copy</button>
</div>
<pre>${escapeHtml(cleaned)}</pre>
</div>`;
    }
  });
 
  d.innerHTML = html;
  chat.appendChild(d);
  scrollDown();
}
 
function handleCopy(button, text) {
    navigator.clipboard.writeText(text).then(() => {
        const originalText = button.innerText;
        button.innerText = "Copied";
        setTimeout(() => {
            button.innerText = originalText;
        }, 2000);
    });
}
 
/* THIS IS THE ONLY ADDITION */
function copyCode(button){
  const code = button.closest(".code-block").querySelector("pre").innerText;
 
  navigator.clipboard.writeText(code).then(() => {
    const originalText = button.innerText;
    button.innerText = "Copied";
 
    setTimeout(() => {
      button.innerText = originalText;
    }, 1500);
  });
}
 
/* SEND — UNCHANGED */
function send(){
  const t = msgInput.value.trim();
  if(!t && pendingImages.length === 0) return;
 
  if(t) add(t, "user");
 
  pendingImages.forEach(src=>{
    const d = document.createElement("div");
    d.className="msg user";
    const img = document.createElement("img");
    img.src = src;
    d.appendChild(img);
    chat.appendChild(d);
  });
 
  const typing = document.createElement("div");
  typing.className = "msg bot";
  typing.innerText = "Typing...";
  chat.appendChild(typing);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      module:"it",
      session_id:session
    })
  })
  .then(r=>r.json())
  .then(d=>{
    typing.remove();
    add(d.text,"bot");
  });
 
  pendingImages = [];
  previewBar.innerHTML = "";
  msgInput.value="";
  msgInput.style.height="auto";
}
 
msgInput.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
 
function selectImage(){
  document.getElementById("fileInput").click();
}
 
document.getElementById("fileInput").addEventListener("change", e=>{
  [...e.target.files].forEach(file=>storeImage(file));
});
 
document.addEventListener("paste", e=>{
  for(let item of e.clipboardData.items){
    if(item.type.includes("image")){
      storeImage(item.getAsFile());
    }
  }
});
 
function storeImage(file){
  const reader = new FileReader();
  reader.onload = e=>{
    const src = e.target.result;
    pendingImages.push(src);
    const img = document.createElement("img");
    img.src = src;
    previewBar.appendChild(img);
  };
  reader.readAsDataURL(file);
}
 
function scrollDown(){
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}
 
function escapeHtml(str){
  return str.replace(/[&<>]/g,m=>(
    {"&":"&amp;","<":"&lt;",">":"&gt;"}[m]
  ));
}
 
</script>
 
</body>
</html>
