<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NexAI IT</title>
 
<style>
    body {
        background: #0f172a;
        font-family: Arial;
        color: white;
    }
 
    .container {
        width: 420px;
        margin: 30px auto;
        background: #1e293b;
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
    }
 
    h2 {
        text-align: center;
        color: cyan;
    }
 
    .chat-box {
        height: 400px;
        overflow-y: auto;
        padding: 10px;
    }
 
    .user-message {
        background: #0284c7;
        padding: 10px;
        border-radius: 12px;
        margin: 10px 0;
        text-align: right;
    }
 
    .bot-message {
        background: #334155;
        padding: 10px;
        border-radius: 12px;
        margin: 10px 0;
    }
 
    pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 14px;
    }
 
    button.copy-btn {
        margin-top: 8px;
        padding: 5px 10px;
        border: none;
        background: #0284c7;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }
 
    button.copy-btn:hover {
        background: #0369a1;
    }
 
    .input-area {
        display: flex;
        margin-top: 10px;
    }
 
    textarea {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        resize: none;
    }
 
    .send-btn {
        background: #0284c7;
        color: white;
        border: none;
        padding: 10px 15px;
        margin-left: 5px;
        border-radius: 8px;
        cursor: pointer;
    }
 
    a {
        color: #38bdf8;
        text-decoration: underline;
    }
</style>
 
</head>
 
<body>
 
<div class="container">
 
    <h2>🖥️ NexAI IT</h2>
 
    <div class="chat-box" id="chatBox"></div>
 
    <div class="input-area">
        <textarea id="inputBox" rows="2" placeholder="Ask IT..."></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
 
</div>
 
<script>
 
let session_id = Math.random().toString();
 
// Convert URLs into clickable links
function formatText(text) {
    const urlPattern = /(https?:\/\/[^\s]+|portal\.azure\.com)/g;
   
    return text.replace(urlPattern, function(url) {
        if (!url.startsWith("http")) {
            url = "https://" + url;
        }
        return `<a href="${url}" target="_blank/ Add user message
function addUserMessage(text) {
    const div = document.createElement("div");
    div.className = "user-message";
    div.innerText = text;
    chatBox.appendChild(div);
}
 
// Add bot message (with COPY button + links)
function addBotMessage(text) {
 
    const div = document.createElement("div");
    div.className = "bot-message";
 
    const content = document.createElement("div");
    content.innerHTML = formatText(text);
 
    // Copy button
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.innerText = "Copy";
 
    btn.onclick = () => {
        navigator.clipboard.writeText(text);
        btn.innerText = "Copied";
        setTimeout(() => btn.innerText = "Copy", 1500);
    };
 
    div.appendChild(content);
    div.appendChild(btn);
 
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
 
// Send message
async function sendMessage() {
 
    let input = document.getElementById("inputBox");
    let message = input.value.trim();
 
    if (!message) return;
 
    addUserMessage(message);
 
    input.value = "";
 
    const response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: message,
            module: "it",
            session_id: session_id
        })
    });
 
    const data = await response.json();
 
    addBotMessage(data.text);
}
 
// SHIFT + ENTER support
document.getElementById("inputBox").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
 
</script>
 
</body>
</html>
