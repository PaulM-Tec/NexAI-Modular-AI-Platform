<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body{
  margin:0;
  font-family:Arial;
  background:#1e1e2f;
}
.app{
  width:95%;
  max-width:420px;
  height:75vh;
  margin:20px auto;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:12px;
  overflow:hidden;
}
.header{
  padding:12px;
  text-align:center;
  background:#111;
  color:#00d4ff;
}
.chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
  padding-bottom:70px;
  display:flex;
  flex-direction:column;
}
.msg{
  max-width:75%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  font-size:13px;
  align-self:flex-start;
}
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
}
.msg pre{
  white-space:pre-wrap;
  word-wrap:break-word;
  background:#111;
  padding:6px;
  border-radius:5px;
}
 
/* Copy button */
.copy-btn{
  margin-top:5px;
  padding:4px 8px;
  font-size:11px;
  background:#0078d7;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}
 
.input{
  display:flex;
  padding:8px;
  background:#111;
}
 
/* textarea for Shift+Enter */
textarea{
  flex:1;
  padding:8px;
  background:#333;
  color:white;
  border:none;
  resize:none;
}
 
button{
  padding:8px;
  background:#0078d7;
  color:white;
  border:none;
}
</style>
</head>
 
<body>
 
<div class="app">
<div class="header">🖥️ NexAI IT</div>
<div id="chat" class="chat"></div>
 
<div class="input">
<textarea id="msg" rows="2" placeholder="Ask IT..."></textarea>
<button id="sendBtn">Send</button>
</div>
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("sendBtn");  // FIX
const session = Date.now();
 
 
// Safe Markdown + Link rendering
function renderText(text){
  try {
    if (window.marked) {
      return marked.parse(text);
    }
  } catch(e){
    console.error("Marked error:", e);
  }
  return text; // fallback if marked fails
}
 
 
// ADD MESSAGE (SAFE)
function add(text,type){
 
  const d=document.createElement("div");
  d.className="msg "+type;
 
  if(type==="bot"){
 
    d.innerHTML = renderText(text);
 
    // copy button
    const btn=document.createElement("button");
    btn.className="copy-btn";
    btn.innerText="Copy";
 
    btn.onclick=()=>{
      navigator.clipboard.writeText(text);
      btn.innerText="Copied!";
      setTimeout(()=>btn.innerText="Copy",1500);
    };
 
    d.appendChild(btn);
 
  }else{
    d.innerText=text;
  }
 
  chat.appendChild(d);
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}
 
 
// SEND FUNCTION (FIXED)
function send(){
 
  const t = msgInput.value.trim();
  if(!t) return;
 
  add(t,"user");
 
  const thinking=document.createElement("div");
  thinking.className="msg bot";
  thinking.innerText="Thinking...";
  chat.appendChild(thinking);
 
  msgInput.value="";
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      module:"it",
      session_id:session
    })
  })
  .then(r=>r.json())
  .then(d=>{
    thinking.remove();
    add(d.text,"bot");
  })
  .catch(err=>{
    console.error(err);
    thinking.innerText = "Error connecting to server";
  });
}
 
 
// FIX: Button click binding (critical)
sendBtn.addEventListener("click", send);
 
 
// FIX: Enter + Shift+Enter
msgInput.addEventListener("keydown", e=>{
 
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
 
  // Shift+Enter → newline (default)
});
 
</script>
 
</body>
</html>
