<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
 
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
 
.wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100%;
}
 
.app{
  max-width:420px;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#252542;
}
 
.header{
  padding:14px;
  text-align:center;
  background:#0078d7;
  color:white;
}
 
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
 
/* MESSAGE FIX */
.msg{
  max-width:80%;
  width:fit-content;
  padding:12px;
  border-radius:16px;
  word-wrap:break-word;
}
 
.user{
  background:#0078d7;
  align-self:flex-end;
}
 
.bot{
  background:#2d2d44;
  align-self:flex-start;
}
 
/* CODE BLOCK FIX */
.code-block{
  margin-top:10px;
  background:#111;
  border-radius:8px;
  overflow:hidden;
}
 
.code-header{
  display:flex;
  justify-content:space-between;
  padding:6px;
  background:#333;
}
 
.copy-btn{
  background:#0078d7;
  color:white;
  border:none;
  padding:3px 8px;
  cursor:pointer;
}
 
/* CRITICAL FIX */
.code-block pre{
  margin:0;
  padding:10px;
  overflow-x:auto;
  max-width:100%;
  white-space:pre;
}
 
.input{
  display:flex;
  padding:10px;
  background:#111;
}
 
textarea{
  flex:1;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#2b2b40;
  color:white;
}
 
button{
  margin-left:6px;
}
 
</style>
</head>
 
<body>
 
<div class="wrapper">
<div class="app">
 
<div class="header">⚡ NexAI Assist</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<textarea id="msg"></textarea>
<button onclick="send()">Send</button>
<input type="file" id="fileInput" hidden>
</div>
 
</div>
</div>
 
<script>
 
const chat=document.getElementById("chat");
const session=Date.now();
 
/* FIXED RENDERING */
function add(text,type){
 
  const parts = text.split(/```/g);
 
  parts.forEach((part,i)=>{
 
    let d=document.createElement("div");
    d.className="msg "+type;
 
    if(i%2===0){
      d.innerHTML = marked.parse(part);
    }
    else{
      d.innerHTML = `
        <div class="code-block">
          <div class="code-header">
            PowerShell
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
          <pre>${escapeHtml(part)}</pre>
        </div>`;
    }
 
    chat.appendChild(d);
  });
 
  scroll();
}
 
function copyCode(btn){
  const code=btn.closest(".code-block").querySelector("pre").innerText;
  navigator.clipboard.writeText(code);
}
 
/* SEND */
function send(){
 
  let text=document.getElementById("msg").value.trim();
  if(!text)return;
 
  add(text,"user");
 
  let typing=document.createElement("div");
  typing.className="msg bot";
  typing.innerText="Typing...";
  chat.appendChild(typing);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:text,
      session_id:session
    })
  })
  .then(r=>r.json())
  .then(d=>{
    typing.remove();
    add(d.text,"bot");
  });
}
 
function scroll(){
  chat.scrollTop=chat.scrollHeight;
}
 
function escapeHtml(t){
  return t.replace(/[&<>]/g,m=>(
    {"&":"&amp;","<":"&lt;",">":"&gt;"}[m]
  ));
}
 
</script>
 
</body>
</html>
