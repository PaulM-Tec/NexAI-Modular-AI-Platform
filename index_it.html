<!DOCTYPE html>
<html>
<head>
 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
 
<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<!-- Syntax Highlight -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/common.min.js"></script>
 
<style>
 
/* GLOBAL */
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial;
}
 
/* APP */
.app{
  width:95%;
  max-width:420px;
  height:85vh;
  margin:10px auto;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:16px;
  overflow:hidden;
}
 
.header{
  padding:14px;
  text-align:center;
  background:linear-gradient(90deg,#0078d7,#00c6ff);
  color:white;
}
 
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
 
/* MESSAGE */
.msg{
  max-width:85%;
  border-radius:16px;
  padding:10px;
}
 
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
}
 
/* CODE */
.code-block{
  background:#16172b;
  border-radius:10px;
  overflow:hidden;
}
 
.code-header{
  display:flex;
  justify-content:space-between;
  padding:6px 10px;
  background:#2c2f48;
}
 
pre{
  margin:0;
  padding:10px;
}
 
/* INPUT */
.input{
  display:flex;
  gap:6px;
  padding:10px;
  background:#111;
}
 
textarea{
  flex:1;
  resize:none;
  border:none;
  border-radius:10px;
  padding:8px;
  background:#2b2b40;
  color:white;
}
 
/* BUTTONS */
button{
  background:#0078d7;
  color:white;
  border:none;
  border-radius:20px;
  padding:8px;
  cursor:pointer;
}
 
.upload-btn{
  width:35px;
  border-radius:50%;
}
 
</style>
</head>
 
<body>
 
<div class="app">
 
<div class="header">⚡ NexAI Assist</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
 
<button class="upload-btn" onclick="selectImage()">+</button>
 
<button onclick="startVoice()">🎤</button>
 
<textarea id="msg"></textarea>
 
<button onclick="send()">Send</button>
 
<input type="file" id="fileInput" style="display:none" accept="image/*">
 
</div>
 
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
 
/* LOAD HISTORY */
window.onload = () => {
  const saved = localStorage.getItem("chat");
  if(saved){
    chat.innerHTML = saved;
  } else {
    add("👋 Hi, how can I help?", "bot");
  }
};
 
/* SAVE */
function save(){
  localStorage.setItem("chat", chat.innerHTML);
}
 
/* ADD MESSAGE */
function add(text, type){
 
  if(type === "user"){
    const d=document.createElement("div");
    d.className="msg user";
    d.innerText=text;
    chat.appendChild(d);
    save();
    return;
  }
 
  const parts=text.split(/```/g);
 
  parts.forEach((p,i)=>{
    if(i%2===0){
      let d=document.createElement("div");
      d.className="msg bot";
      d.innerHTML=marked.parse(p);
      chat.appendChild(d);
    } else {
      let clean=p.split("\n").slice(1).join("\n");
 
      let d=document.createElement("div");
      d.className="msg bot";
 
      d.innerHTML=`
        <div class="code-block">
          <div class="code-header">
            PowerShell
            <button onclick="copyCode(this)">Copy</button>
          </div>
          <pre><code>${clean}</code></pre>
        </div>
      `;
 
      chat.appendChild(d);
    }
  });
 
  highlight();
  scroll();
  save();
}
 
/* HIGHLIGHT */
function highlight(){
  document.querySelectorAll("pre code").forEach(block=>{
    hljs.highlightElement(block);
  });
}
 
/* COPY */
function copyCode(btn){
  const code=btn.closest(".code-block").innerText;
  navigator.clipboard.writeText(code);
}
 
/* SEND */
function send(){
  let t=msgInput.value.trim();
  if(!t)return;
 
  add(t,"user");
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:t,module:"it"})
  })
  .then(r=>r.json())
  .then(d=>{
    add(d.text,"bot");
  });
 
  msgInput.value="";
}
 
/* AUTO EXPAND */
msgInput.addEventListener("input",()=>{
  msgInput.style.height="auto";
  msgInput.style.height=msgInput.scrollHeight+"px";
});
 
/* ENTER */
msgInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});
 
/* IMAGE */
function selectImage(){
  document.getElementById("fileInput").click();
}
 
document.getElementById("fileInput").addEventListener("change",e=>{
  handleImage(e.target.files[0]);
});
 
/* DRAG DROP */
chat.addEventListener("dragover",e=>e.preventDefault());
chat.addEventListener("drop",e=>{
  e.preventDefault();
  handleImage(e.dataTransfer.files[0]);
});
 
/* IMAGE HANDLER */
function handleImage(file){
  if(!file)return;
 
  let reader=new FileReader();
 
  reader.onload=e=>{
    let img=document.createElement("img");
    img.src=e.target.result;
 
    let d=document.createElement("div");
    d.className="msg user";
    d.appendChild(img);
 
    chat.appendChild(d);
    save();
  };
 
  reader.readAsDataURL(file);
 
  /* SEND TO BACKEND */
  let fd=new FormData();
  fd.append("image",file);
  fetch("/upload",{method:"POST",body:fd});
}
 
/* VOICE */
function startVoice(){
  const r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
  r.onresult=e=>{
    msgInput.value+=e.results[0][0].transcript;
  };
  r.start();
}
 
/* SCROLL */
function scroll(){
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}
 
</script>
 
</body>
</html>
