<!DOCTYPE html>
<html>
<head>
 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
 
<style>
 
/* GLOBAL */
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
 
/* NOTICE */
.notice{
  text-align:center;
  font-size:12px;
  color:#aaa;
  padding:6px;
  background:#111;
}
 
/* APP */
.app{
  width:95%;
  max-width:420px;
  height:85vh;
  margin:10px auto;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,0.5);
  overflow:hidden;
}
 
/* HEADER */
.header{
  padding:14px;
  text-align:center;
  background:linear-gradient(90deg,#0078d7,#00c6ff);
  color:white;
  font-weight:bold;
}
 
/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-bottom:90px;
}
 
/* MESSAGE */
.msg{
  max-width:85%;
  border-radius:16px;
  padding:10px;
  font-size:14px;
  line-height:1.5;
}
 
/* USER */
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
/* BOT */
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
}
 
/* IMAGES */
.msg img{
  max-width:100%;
  border-radius:10px;
  margin-top:8px;
}
 
/* CODE BLOCK */
.code-block{
  background:#16172b;
  border-radius:10px;
  overflow:hidden;
}
 
/* CODE HEADER */
.code-header{
  display:flex;
  justify-content:space-between;
  padding:6px 10px;
  font-size:12px;
  background:#2c2f48;
  color:#ccc;
}
 
/* CODE */
pre{
  margin:0;
  padding:12px;
  overflow-x:auto;
}
 
/* COPY */
.copy-btn{
  background:#0078d7;
  border:none;
  color:white;
  padding:4px 8px;
  font-size:12px;
  border-radius:5px;
  cursor:pointer;
}
 
/* INPUT */
.input{
  position:sticky;
  bottom:0;
  display:flex;
  gap:6px;
  padding:10px;
  background:#111;
  border-top:1px solid #333;
}
 
/* TEXTBOX (AUTO GROW) */
textarea{
  flex:1;
  padding:10px;
  background:#2b2b40;
  color:white;
  border:none;
  border-radius:12px;
  resize:none;
  font-size:14px;
  max-height:120px;
  overflow-y:auto;
}
 
/* BUTTON */
button{
  padding:10px 14px;
  background:#0078d7;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
 
button:hover{
  background:#005fa3;
}
 
/* UPLOAD BUTTON */
.upload-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#0078d7;
  color:white;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border:none;
}
 
</style>
</head>
 
<body>
 
<div class="notice">
AI-generated content may be incorrect
</div>
 
<div class="app">
 
<div class="header">⚡ NexAI Assist</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
 
<button class="upload-btn" onclick="selectImage()">+</button>
 
<textarea id="msg" rows="1" placeholder="Ask an IT question..."></textarea>
 
<button onclick="send()">Send</button>
 
<input type="file" id="fileInput" style="display:none" accept="image/*">
 
</div>
 
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const session = Date.now();
 
/* GREETING */
window.onload = () => {
  add("👋 Hi, I'm NexAI.\nHow can I help you with IT today?", "bot");
};
 
/* AUTO EXPAND TEXTAREA */
msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = msgInput.scrollHeight + "px";
});
 
/* ADD MESSAGE */
function add(text, type){
 
  if(type === "user"){
    const d = document.createElement("div");
    d.className = "msg user";
    d.innerText = text;
    chat.appendChild(d);
    scrollDown();
    return;
  }
 
  const parts = text.split(/```/g);
 
  parts.forEach((part, index) => {
 
    if(index % 2 === 0){
      if(part.trim()){
        const t = document.createElement("div");
        t.className = "msg bot";
        t.innerHTML = marked.parse(part);
        chat.appendChild(t);
      }
    } else {
 
      const clean = cleanCode(part);
 
      const c = document.createElement("div");
      c.className = "msg bot";
 
      c.innerHTML = `
        <div class="code-block">
          <div class="code-header">
            PowerShell
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
          <pre>${escapeHtml(clean)}</pre>
        </div>
      `;
 
      chat.appendChild(c);
    }
 
  });
 
  scrollDown();
}
 
/* CLEAN CODE */
function cleanCode(code){
  const lines = code.trim().split("\n");
  if(lines[0].toLowerCase().includes("powershell")){
    lines.shift();
  }
  return lines.join("\n");
}
 
/* SCROLL */
function scrollDown(){
  setTimeout(() => chat.scrollTop = chat.scrollHeight, 50);
}
 
/* SEND */
function send(){
  const t = msgInput.value.trim();
  if(!t) return;
 
  add(t, "user");
 
  const thinking = document.createElement("div");
  thinking.className = "msg bot";
  thinking.innerText = "Typing...";
  chat.appendChild(thinking);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      module:"it",
      session_id:session
    })
  })
  .then(r => r.json())
  .then(d => {
    thinking.remove();
    add(d.text, "bot");
  });
 
  msgInput.value="";
  msgInput.style.height = "auto";
}
 
/* ENTER + SHIFT ENTER */
msgInput.addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
 
/* COPY */
function copyCode(btn){
  const code = btn.closest(".code-block")
                 .querySelector("pre")
                 .innerText.trim();
 
  navigator.clipboard.writeText(code).then(()=>{
    btn.innerText="Copied!";
    setTimeout(()=>btn.innerText="Copy",1500);
  });
}
 
/* IMAGE UPLOAD */
function selectImage(){
  document.getElementById("fileInput").click();
}
 
document.getElementById("fileInput").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
 
  const reader = new FileReader();
 
  reader.onload = function(evt){
    const wrapper = document.createElement("div");
    wrapper.className = "msg user";
 
    const img = document.createElement("img");
    img.src = evt.target.result;
 
    wrapper.appendChild(img);
    chat.appendChild(wrapper);
    scrollDown();
  };
 
  reader.readAsDataURL(file);
});
 
/* ESCAPE HTML */
function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[m]);
}
 
</script>
 
</body>
</html>
