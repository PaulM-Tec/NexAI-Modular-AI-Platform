<!DOCTYPE html>
<html>
<head>
 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Assist</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
 
<style>
 
/* GLOBAL */
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
 
/* NOTICE */
.notice{
  text-align:center;
  font-size:12px;
  color:#aaa;
  padding:6px;
  background:#111;
}
 
/* CENTER WRAPPER */
.wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  height:calc(100% - 24px);
}
 
/* APP CARD */
.app{
  width:100%;
  max-width:420px;
  height:95%;
  display:flex;
  flex-direction:column;
 
  background:#252542;
  border-radius:16px;
  overflow:hidden;
 
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
}
 
/* HEADER */
.header{
  padding:14px;
  text-align:center;
  background:linear-gradient(90deg,#0078d7,#00c6ff);
  color:white;
  font-weight:bold;
  flex-shrink:0;
}
 
/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
 
/* MESSAGE */
.msg{
  max-width:80%;
  border-radius:16px;
  padding:12px;
  font-size:14px;
  line-height:1.4;
}
 
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
}
 
/* IMAGES */
.msg img{
  max-width:100%;
  border-radius:10px;
  margin-top:6px;
}
 
/* CODE */
.code-block{
  background:#16172b;
  border-radius:10px;
  overflow:hidden;
}
 
.code-header{
  display:flex;
  justify-content:space-between;
  padding:6px 10px;
  background:#2c2f48;
  font-size:12px;
}
 
pre{
  margin:0;
  padding:10px;
  overflow-x:auto;
  white-space:pre-wrap;
}
 
/* COPY */
.copy-btn{
  background:#0078d7;
  border:none;
  color:white;
  padding:4px 8px;
  border-radius:5px;
  cursor:pointer;
}
 
/* INPUT */
.input{
  display:flex;
  gap:6px;
  padding:10px;
  background:#111;
  flex-shrink:0;
}
 
/* TEXTBOX */
textarea{
  flex:1;
  padding:10px;
  background:#2b2b40;
  color:white;
  border:none;
  border-radius:12px;
  resize:none;
  font-size:14px;
  max-height:120px;
  overflow-y:auto;
}
 
/* BUTTON */
button{
  padding:10px 14px;
  background:#0078d7;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
 
/* + BUTTON */
.upload-btn{
  width:36px;
  border-radius:50%;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
 
/* MOBILE FULLSCREEN */
@media(max-width:600px){
  .wrapper{
    height:100%;
  }
 
  .app{
    height:100%;
    max-width:100%;
    border-radius:0;
  }
}
 
</style>
 
</head>
 
<body>
 
<div class="notice">
AI-generated content may be incorrect
</div>
 
<div class="wrapper">
 
<div class="app">
 
<div class="header">⚡ NexAI Assist</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
 
<button class="upload-btn" onclick="selectImage()">+</button>
 
<textarea id="msg" rows="1" placeholder="Ask an IT question..."></textarea>
 
<button onclick="send()">Send</button>
 
<input type="file" id="fileInput" style="display:none" accept="image/*">
 
</div>
 
</div>
 
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
 
/* GREETING */
window.onload = () => {
  add("👋 Hi, I'm NexAI. How can I help you with IT today?", "bot");
};
 
/* AUTO EXPAND */
msgInput.addEventListener("input", () => {
  msgInput.style.height = "auto";
  msgInput.style.height = msgInput.scrollHeight + "px";
});
 
/* ADD */
function add(text, type){
 
  if(type === "user"){
    let d=document.createElement("div");
    d.className="msg user";
    d.innerText=text;
    chat.appendChild(d);
    scrollDown();
    return;
  }
 
  let parts=text.split(/```/g);
 
  parts.forEach((p,i)=>{
    if(i%2===0){
      if(p.trim()){
        let d=document.createElement("div");
        d.className="msg bot";
        d.innerHTML=marked.parse(p);
        chat.appendChild(d);
      }
    } else {
 
      let clean=cleanCode(p);
 
      let d=document.createElement("div");
      d.className="msg bot";
 
      d.innerHTML=`
        <div class="code-block">
          <div class="code-header">
            PowerShell
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
          <pre>${escapeHtml(clean)}</pre>
        </div>
      `;
 
      chat.appendChild(d);
    }
  });
 
  scrollDown();
}
 
/* CLEAN CODE */
function cleanCode(code){
  let lines=code.trim().split("\n");
  if(lines[0].toLowerCase().includes("powershell")){
    lines.shift();
  }
  return lines.join("\n");
}
 
/* SEND */
function send(){
  let t=msgInput.value.trim();
  if(!t)return;
 
  add(t,"user");
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:t,module:"it"})
  })
  .then(r=>r.json())
  .then(d=>add(d.text,"bot"));
 
  msgInput.value="";
  msgInput.style.height="auto";
}
 
/* ENTER */
msgInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});
 
/* COPY */
function copyCode(btn){
  let code=btn.closest(".code-block")
              .querySelector("pre")
              .innerText.trim();
 
  navigator.clipboard.writeText(code);
}
 
/* FILE BUTTON */
function selectImage(){
  document.getElementById("fileInput").click();
}
 
/* FILE UPLOAD */
document.getElementById("fileInput").addEventListener("change",e=>{
  let file=e.target.files[0];
  if(!file)return;
  handleImage(file);
});
 
/* PASTE */
document.addEventListener("paste",e=>{
  for(let item of e.clipboardData.items){
    if(item.type.includes("image")){
      handleImage(item.getAsFile());
    }
  }
});
 
/* HANDLE IMAGE */
function handleImage(file){
  let reader=new FileReader();
 
  reader.onload=e=>{
    let d=document.createElement("div");
    d.className="msg user";
 
    let img=document.createElement("img");
    img.src=e.target.result;
 
    d.appendChild(img);
    chat.appendChild(d);
    scrollDown();
  };
 
  reader.readAsDataURL(file);
}
 
/* SCROLL */
function scrollDown(){
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}
 
/* ESCAPE */
function escapeHtml(str){
  return str.replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[m]);
}
 
</script>
 
</body>
</html>
