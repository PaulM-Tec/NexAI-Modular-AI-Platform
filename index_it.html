<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body { margin:0; font-family:Arial; background:#1e1e2f; display:flex; justify-content:center;}
 
.app { width:100%; max-width:420px; height:88vh; display:flex; flex-direction:column; background:#252542; }
 
.header { background:#111; color:#00d4ff; padding:10px; text-align:center; font-size:14px;}
 
.chat { flex:1; overflow-y:auto; padding:8px;}
 
.msg { margin:5px 0; padding:8px; border-radius:8px; max-width:70%; font-size:13px; word-wrap:break-word;}
.user { background:#0078d7; color:white; margin-left:auto;}
.bot { background:#2d2d44; color:#eee;}
 
.input { display:flex; padding:6px; background:#111;}
input { flex:1; padding:8px; background:#333; color:white; border:none;}
button { padding:8px; background:#0078d7; color:white; border:none;}
 
</style>
</head>
 
<body>
<div class="app">
<div class="header">🖥️ NexAI IT Support</div>
<div id="chat" class="chat"></div>
 
<div class="input">
<input id="msg" placeholder="Ask IT..." />
<button onclick="send()">Send</button>
</div>
</div>
 
<script>
let session=Date.now();
 
function add(t,type){
let d=document.createElement("div");
d.className="msg "+type;
d.innerHTML=type==="bot"?marked.parse(t):t;
chat.appendChild(d);
chat.scrollTop=chat.scrollHeight;
}
 
function send(){
let t=msg.value.trim(); if(!t)return;
add(t,"user");
 
let thinking=document.createElement("div");
thinking.className="msg bot";
thinking.id="t";
thinking.innerText="Thinking...";
chat.appendChild(thinking);
 
fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:t,session_id:session})})
.then(r=>r.json())
.then(d=>{ document.getElementById("t")?.remove(); add(d.response,"bot");})
 
msg.value="";
}
 
msg.addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });
</script>
</body>
</html>
