<!DOCTYPE html>
<html>
<head>
    <title>NexAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
 
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial;
            background: #eef2f7;
        }
 
        #container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
 
        #header {
            background: #0078d4;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
 
        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
 
        .message {
            margin-bottom: 12px;
            display: flex;
        }
 
        .user {
            justify-content: flex-end;
        }
 
        .user div {
            background: #0078d4;
            color: white;
            padding: 10px;
            border-radius: 12px;
            max-width: 70%;
        }
 
        .bot {
            justify-content: flex-start;
        }
 
        .bot div {
            background: #e5e5ea;
            padding: 10px;
            border-radius: 12px;
            max-width: 70%;
        }
 
        /* ✅ TYPING UI */
        .typing {
            display: flex;
            align-items: center;
        }
 
        .dots span {
            width: 6px;
            height: 6px;
            margin: 0 2px;
            background: #333;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.4s infinite;
        }
 
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
 
        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
 
        #inputArea {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 10px;
        }
 
        #input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
 
        button {
            margin-left: 10px;
            padding: 10px;
            border: none;
            background: #0078d4;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
 
<body>
 
<div id="container">
 
    <div id="header">
        🚗 NexAI Service Assistant
    </div>
 
    <div id="messages"></div>
 
    <div id="inputArea">
        <input type="text" id="input" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
    </div>
 
</div>
 
<script>
 
async function sendMessage() {
 
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
 
    const text = input.value.trim();
    if (!text) return;
 
    // USER MESSAGE
    messages.innerHTML += `
        <div class="message user">
            <div>${text}</div>
        </div>
    `;
 
    input.value = "";
 
    // CREATE TYPING FIRST (VISIBLE GUARANTEED)
    const typingId = "typing-" + Date.now();
 
    messages.innerHTML += `
        <div class="message bot" id="${typingId}">
            <div class="typing">
                NexAI
                <span class="dots"><span></span><span></span><span></span></span>
            </div>
        </div>
    `;
 
    messages.scrollTop = messages.scrollHeight;
 
    try {
        // START FETCH BUT DO NOT WAIT YET
        const request = fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                session_id: 1,
                message: text
            })
        });
 
        // FORCE VISIBLE THINKING (CRITICAL)
        await new Promise(resolve => setTimeout(resolve, 1500));
 
        // NOW GET RESPONSE
        const res = await request;
        const data = await res.json();
 
        const reply = data.response.replace(/\n/g, "<br>");
 
        // REMOVE TYPING
        const typingEl = document.getElementById(typingId);
        if (typingEl) typingEl.remove();
 
        // SHOW RESPONSE
        messages.innerHTML += `
            <div class="message bot">
                <div>${reply}</div>
            </div>
        `;
 
        messages.scrollTop = messages.scrollHeight;
 
    } catch (err) {
        console.error(err);
 
        const typingEl = document.getElementById(typingId);
        if (typingEl) typingEl.remove();
 
        messages.innerHTML += `
            <div class="message bot">
                <div>NexAI: Error connecting to server.</div>
            </div>
        `;
    }
}
 
// ENTER KEY
window.onload = function () {
 
    const messages = document.getElementById("messages");
 
    messages.innerHTML += `
        <div class="message bot">
            <div>NexAI: Hello! You can book a service or ask a question.</div>
        </div>
    `;
 
    document.getElementById("input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
};
 
</script>
 
</body>
</html>
