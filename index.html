<!DOCTYPE html>
<html>
<head>
    <title>AI Vehicle Service Assistant</title>
 
    <meta name="viewport" content="width=device-width, initial-scale=1">
 
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 10px;
        }
 
        #container {
            max-width: 500px;
            margin: auto;
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
 
        h2 {
            text-align: center;
        }
 
        #messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }
 
        .user {
            color: blue;
            margin-bottom: 5px;
        }
 
        .bot {
            color: green;
            margin-bottom: 10px;
        }
 
        input {
            width: 70%;
            padding: 8px;
        }
 
        button {
            padding: 8px;
        }
    </style>
</head>
 
<body>
 
<div id="container">
 
    <h2>🚗 AI Service Assistant</h2>
 
    <div id="messages"></div>
 
    <input type="text" id="input" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
 
</div>
 
<script>
 
async function sendMessage() {
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
 
    const userText = input.value.trim();
 
    if (!userText) return;
 
    // Show user message
    messages.innerHTML += `<div class="user"><b>You:</b> ${userText}</div>`;
 
    // API call
    const response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            session_id: 1,
            message: userText
        })
    });
 
    const data = await response.json();
 
    // Convert newlines to HTML line breaks
    const botText = data.response.replace(/\n/g, "<br>");
 
    messages.innerHTML += `<div class="bot"><b>AI:</b><br>${botText}</div>`;
 
    input.value = "";
 
    messages.scrollTop = messages.scrollHeight;
}
 
</script>
 
</body>
</html>
