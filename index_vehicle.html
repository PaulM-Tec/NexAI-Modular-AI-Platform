<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>NexAI Vehicle</title>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f4f4;
}
 
/* CENTER CONTAINER */
.container {
    max-width: 900px;
    margin: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: white;
}
 
/* HEADER */
.header {
    background: #0078d7;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 18px;
}
 
/* CHAT AREA */
.chatbox {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}
 
/* MESSAGES */
.message {
    margin: 10px 0;
    padding: 10px;
    border-radius: 8px;
    max-width: 75%;
}
 
.user {
    background: #0078d7;
    color: white;
    margin-left: auto;
}
 
.bot {
    background: #e9e9e9;
}
 
/* INPUT BAR */
.input-area {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
}
 
input {
    flex: 1;
    padding: 10px;
}
 
button {
    padding: 10px 15px;
    background: #0078d7;
    color: white;
    border: none;
}
 
/* MOBILE FIX */
@media (max-width: 600px) {
    .container {
        height: 100vh;
        max-width: 100%;
    }
 
    .message {
        max-width: 90%;
    }
}
</style>
</head>
 
<body>
 
<div class="container">
 
    <div class="header">🚗 NexAI Vehicle Assistant</div>
 
    <div id="chat" class="chatbox"></div>
 
    <div class="input-area">
        <input id="msg" placeholder="Ask about your vehicle..." />
        <button onclick="sendMessage()">Send</button>
    </div>
 
</div>
 
<script>
 
let sessionId = Date.now();
 
function addMessage(text, cls) {
    let div = document.createElement("div");
    div.className = "message " + cls;
 
    div.innerHTML = cls === "bot"
        ? marked.parse(text)
        : text;
 
    document.getElementById("chat").appendChild(div);
    document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
}
 
function sendMessage() {
 
    let input = document.getElementById("msg");
    let text = input.value;
 
    if (!text) return;
 
    addMessage(text, "user");
 
    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            message: text,
            session_id: sessionId
        })
    })
    .then(res => res.json())
    .then(data => addMessage(data.response, "bot"));
 
    input.value = "";
}
 
</script>
 
</body>
</html>
