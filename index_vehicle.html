<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<!-- FIXED SCRIPT TAG -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body {
  margin:0;
  background:#f0f2f5;
  font-family:Arial;
}
 
/* FIXED APP CONTAINER (UNCHANGED STRUCTURE) */
.app {
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:420px;
  height:100%;
  display:flex;
  flex-direction:column;
  background:white;
}
 
/* HEADER */
.header {
  padding:12px;
  text-align:center;
  background:#0078d7;
  color:white;
  flex:0 0 auto;
}
 
/* CHAT — FIXED OVERLAP */
.chat {
  flex:1;
  overflow-y:auto;
  padding:10px;
  padding-bottom:80px;   /* prevents overlap with input */
  display:flex;
  flex-direction:column;
}
 
/* MESSAGE */
.msg {
  max-width:70%;
  padding:10px;
  margin:4px 0;
  border-radius:10px;
  font-size:13px;
}
 
.user {
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot {
  background:#e5e5e5;
}
 
/* INPUT */
.input {
  display:flex;
  padding:8px;
  border-top:1px solid #ddd;
  flex:0 0 auto;
}
 
input {
  flex:1;
  padding:8px;
}
 
button {
  padding:8px;
  background:#0078d7;
  color:white;
  border:none;
}
</style>
</head>
 
<body>
 
<div class="app">
 
<div class="header">🚗 NexAI Vehicle</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<input id="msg" placeholder="Describe your issue (e.g. book service)" />
<button onclick="send()">Send</button>
</div>
 
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const session = Date.now();
 
/* ADD MESSAGE */
function add(text,type){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.innerHTML = type==="bot" ? marked.parse(text) : text;
 
  chat.appendChild(d);
 
  /* FIX SCROLL TO TRUE BOTTOM */
  setTimeout(() => {
    chat.scrollTop = chat.scrollHeight;
  }, 50);
}
 
/* SEND MESSAGE */
function send(){
  const t = msgInput.value.trim();
  if(!t) return;
 
  add(t,"user");
 
  const thinking=document.createElement("div");
  thinking.className="msg bot";
  thinking.innerText="Thinking...";
  chat.appendChild(thinking);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      module:"vehicle",
      session_id:session
    })
  })
  .then(r=>r.json())
  .then(d=>{
    thinking.remove();
    add(d.text,"bot");
  });
 
  msgInput.value="";
}
 
/* ENTER KEY */
msgInput.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    send();
  }
});
 
</script>
 
</body>
</html>
