<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
body {
  margin:0;
  display:flex;
  justify-content:center;
  background:#f0f2f5;
  font-family:Arial;
}
 
.app {
  width:92%;
  max-width:400px;
  height:75vh;
  margin-top:25px;
  display:flex;
  flex-direction:column;
  background:white;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
}
 
.header {
  padding:10px;
  text-align:center;
  background:#0078d7;
  color:white;
}
 
.chat {
  flex:1;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
}
 
.msg {
  display:inline-block;
  width:fit-content;
  max-width:75%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  font-size:13px;
  white-space:pre-wrap;
  word-break:break-word;
}
 
.user {
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot {
  background:#e5e5e5;
}
 
.input {
  display:flex;
  padding:8px;
  border-top:1px solid #ddd;
}
 
input { flex:1; padding:8px; }
 
button {
  padding:8px;
  background:#0078d7;
  color:white;
  border:none;
}
</style>
</head>
 
<body>
 
<div class="app">
<div class="header">🚗 NexAI Vehicle</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
<input id="msg">
<button onclick="send()">Send</button>
</div>
</div>
 
<script>
function add(text,type){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.innerHTML=(type==="bot")?marked.parse(text):text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
 
function send(){
  let text=msg.value.trim();
  if(!text) return;
 
  add(text,"user");
 
  const thinking=document.createElement("div");
  thinking.className="msg bot";
  thinking.innerText="Thinking...";
  chat.appendChild(thinking);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  })
  .then(r=>r.json())
  .then(d=>{
    thinking.remove();
    add(d.response,"bot");
  });
 
  msg.value="";
}
 
msg.addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});
</script>
 
</body>
</html>
