<!DOCTYPE html>
<html lang="en">
 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>NexAI Vehicle Assistant</title>
 
<!-- FIXED SCRIPT (THIS WAS YOUR BREAKING ISSUE) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<style>
 
body {
    margin: 0;
    font-family: Arial;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
}
 
/* COMPACT AI PANEL (LIKE BEFORE) */
.app {
    width: 100%;
    max-width: 700px;
    height: 95vh;
    display: flex;
    flex-direction: column;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}
 
/* HEADER */
.header {
    background: #0078d7;
    color: white;
    text-align: center;
    padding: 12px;
    font-weight: bold;
}
 
/* CHAT AREA */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}
 
/* MESSAGES */
.msg {
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    max-width: 80%;
}
 
.user {
    background: #0078d7;
    color: white;
    margin-left: auto;
}
 
.bot {
    background: #e6e6e6;
    color: black;
}
 
/* INPUT SECTION */
.input {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
}
 
.input input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
}
 
.input button {
    padding: 10px;
    background: #0078d7;
    color: white;
    border: none;
}
 
/* MOBILE FIX */
@media(max-width:600px) {
    .app {
        max-width: 100%;
        height: 100vh;
        border-radius: 0;
    }
}
 
</style>
</head>
 
<body>
 
<div class="app">
 
<div class="header">🚗 NexAI Vehicle Assistant</div>
 
<div id="chat" class="chat"></div>
 
<div class="input">
    <input id="msg" placeholder="Ask about your vehicle..." />
    <button onclick="send()">Send</button>
</div>
 
</div>
 
<script>
 
let session = Date.now();
 
/* ADD MESSAGE */
function add(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
 
    div.innerHTML = type === "bot"
        ? marked.parse(text)
        : text;
 
    const chat = document.getElementById("chat");
    chat.appendChild(div);
 
    chat.scrollTop = chat.scrollHeight;
}
 
/* SEND MESSAGE */
function send() {
    const input = document.getElementById("msg");
    const text = input.value.trim();
 
    if (!text) return;
 
    add(text, "user");
 
    fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            message: text,
            session_id: session
        })
    })
    .then(res => res.json())
    .then(data => add(data.response, "bot"))
    .catch(() => add("Error contacting server", "bot"));
 
    input.value = "";
}
 
/* ENTER KEY FIX */
document.getElementById("msg").addEventListener("keydown", function(e) {
    if (e.key === "Enter") send();
});
 
</script>
 
</body>
</html>
