<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexAI • Ops</title>
 
<!-- FIXED SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
<!-- FIXED favicon (THIS WAS YOUR TOP BUG) -->
<link rel="icon" href="/favicon.ico?v=2">
 
<style>
 
html, body {
  margin:0;
  height:100%;
  background:linear-gradient(180deg,#1e1e2f,#121220);
  font-family:Arial, sans-serif;
}
 
/* NOTICE */
.notice{
  text-align:center;
  font-size:12px;
  color:#aaa;
  padding:6px;
  background:#111;
}
 
/* FIX: wrapper removes huge bottom gap */
.wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  height:calc(100% - 24px);
}
 
/* APP */
.app{
  width:95%;
  max-width:420px;
  height:95%;
  display:flex;
  flex-direction:column;
  background:#252542;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,0.5);
  overflow:hidden;
}
 
/* HEADER */
.header{
  padding:14px;
  text-align:center;
  background:linear-gradient(90deg,#0078d7,#00c6ff);
  color:white;
  font-weight:bold;
}
 
/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:0;
}
 
/* MESSAGES */
.msg{
  max-width:80%;
  width:fit-content;
  padding:12px;
  border-radius:16px;
  font-size:14px;
  line-height:1.4;
  word-wrap:break-word;
}
 
.user{
  background:#0078d7;
  color:white;
  align-self:flex-end;
}
 
.bot{
  background:#2d2d44;
  color:white;
  align-self:flex-start;
}
 
/* INPUT */
.input{
  display:flex;
  gap:6px;
  padding:10px;
  background:#111;
}
 
input{
  flex:1;
  padding:10px;
  background:#2b2b40;
  color:white;
  border:none;
  border-radius:20px;
}
 
button{
  padding:10px 14px;
  background:#0078d7;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
 
</style>
</head>
 
<body>
 
<div class="notice">
  AI-generated content may be incorrect
</div>
 
<div class="wrapper">
 
  <div class="app">
 
    <div class="header">
      ⚡ NexAI Ops
    </div>
 
    <div id="chat" class="chat"></div>
 
    <div class="input">
      <input id="msg" placeholder="Ask a question or book a service..." />
      <button onclick="send()">Send</button>
    </div>
 
  </div>
 
</div>
 
<script>
 
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const session = Date.now();
 
/* GREETING */
window.onload = () => {
  add("👋 Hi, I'm NexAI. How can I help you today?", "bot");
};
 
/* SAFE ADD */
function add(text, type){
  const d = document.createElement("div");
  d.className = "msg " + type;
 
  try{
    if(type === "bot" && typeof marked !== "undefined"){
      d.innerHTML = marked.parse(text);
    } else {
      d.innerText = text;
    }
  } catch {
    d.innerText = text;
  }
 
  chat.appendChild(d);
  scrollDown();
}
 
/* SEND */
function send(){
  const t = msgInput.value.trim();
  if(!t) return;
 
  add(t, "user");
 
  const typing = document.createElement("div");
  typing.className = "msg bot";
  typing.innerText = "Typing...";
  chat.appendChild(typing);
 
  fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      message:t,
      module:"vehicle",
      session_id:session
    })
  })
  .then(r=>r.json())
  .then(d=>{
    typing.remove();
    add(d.text,"bot");
  });
 
  msgInput.value="";
}
 
/* ENTER */
msgInput.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    send();
  }
});
 
/* SCROLL */
function scrollDown(){
  setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
}
 
</script>
 
</body>
</html>
